# Send flow with PIN confirmation (mock balances; the PIN is checked against the real vault since Phase 2).
appId: dev.anthea.wallet
tags:
  - send
---
- runFlow: onboarding.yaml
- tapOn: 'Senden'
- tapOn: 'USDC'
# "Einfügen" reads the real clipboard since Phase 2
- setClipboard: '0x71C9e0B7d2F4a9C3e1A8b6D5f0C2e4A7b9d304Ae'
- tapOn: 'Einfügen'
- assertVisible: '.*Address-Poisoning-Angriff.*'
- tapOn: '0x71C9…04Ae'
- tapOn: 'Weiter'
- tapOn: '2'
- tapOn: '5'
- tapOn: 'Prüfen'
- assertVisible: '25,00 USDC'
- tapOn: 'Mit PIN bestätigen'
- assertVisible: 'Signatur auf diesem Gerät'
- runFlow:
    file: subflows/enter-pin.yaml
    env:
      PIN: '123456'
      KEYPAD: confirm-key
- extendedWaitUntil:
    visible: 'Gesendet'
    timeout: 20000
- tapOn: 'Fertig'
- assertVisible: 'GESAMTWERT'
